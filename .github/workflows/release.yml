name: Build and verify e-server desktop client
on:
  push:
    branches: ['**']
    tags: ['client-v*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools xvfb
      - if: runner.os == 'Linux'
        run: npm run dist:linux
      - if: runner.os == 'Windows'
        run: npm run dist:windows
      - if: runner.os == 'Linux'
        run: node scripts/build-update.cjs linux
      - if: runner.os == 'Windows'
        run: node scripts/build-update.cjs win32
      - uses: actions/upload-artifact@v4
        with:
          name: eserver-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
            release/*.exe
            release/Easter-e-server-Update-*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/client-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: eserver-*
          path: release
          merge-multiple: true
      - name: Verify all supported installers and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "client-v${VERSION}"
          cd release
          for asset in Easter-e-server-Windows-x64.exe Easter-e-server-Linux-amd64.deb Easter-e-server-Linux-x64.pacman Easter-e-server-Linux-x86_64.AppImage Easter-e-server-Update-linux-x64.asar Easter-e-server-Update-linux-x64.json Easter-e-server-Update-win32-x64.asar Easter-e-server-Update-win32-x64.json; do test -s "$asset"; done
          sha256sum Easter-e-server-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" Easter-e-server-* SHA256SUMS --target "$GITHUB_SHA" --title "e-server client $VERSION" --notes-file ../docs/release-notes.md
